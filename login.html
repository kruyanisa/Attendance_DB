<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="glass-card">
            <div class="logo-area">
                <!-- ใส่โลโก้โรงเรียนตรงนี้ -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            
            <h1>Student Attendance Dashboard</h1>
            <h2>School Management System</h2>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

<div class="input-group">
    <label for="password">Password</label>
    <div class="password-wrapper">
        <input type="password" id="password" name="password" required placeholder="Enter your password">

        <button type="button" class="password-toggle"
                id="toggle-password"
                aria-label="Show password"
                aria-pressed="false">
            <svg id="password-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>
    </div>
</div>
                
                <button id="login-btn" type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");
    const passwordEye = document.getElementById("password-eye");

    togglePassword.addEventListener("click", () => {
        const isPasswordVisible = passwordInput.type === "text";

        passwordInput.type = isPasswordVisible ? "password" : "text";

        togglePassword.setAttribute(
            "aria-label",
            isPasswordVisible ? "Show password" : "Hide password"
        );

        togglePassword.setAttribute(
            "aria-pressed",
            String(!isPasswordVisible)
        );

        passwordEye.innerHTML = isPasswordVisible
            ? '<path d="M2 12s3.5-7 10-7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
            : '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.5 15.5 0 0 1-4.1 4.7"/><path d="M6.3 6.3C3.5 8.2 2 12 2 12s3.5 7 10 7a10.2 10.2 0 0 0 4.4-1"/><path d="M10 10a3 3 0 0 0 4 4"/>';
    });
</script>
</body>
</html>
